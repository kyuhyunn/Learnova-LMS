<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Siswa - Learnova Smart Classroom</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.9);
            --text-color: #c9d1d9;
            --accent-color: #f97316;
            --accent-hover: #ea580c;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #1f2937 0%, var(--bg-color) 70%);
            color: var(--text-color);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card, .dashboard-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .auth-card h2, .dashboard-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .tab-menu {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            padding: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #8b949e;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-submit, .btn-logout {
            width: 100%;
            padding: 11px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover, .btn-logout:hover {
            background-color: var(--accent-hover);
        }

        .btn-logout {
            background-color: #da3633;
        }
        .btn-logout:hover {
            background-color: #b31d18;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .alert-msg {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            display: none;
        }
        .alert-success { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; }
        .alert-error { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #da3633; }

        .student-info {
            background: #161b22;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .student-info p {
            margin: 8px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- KARTU LOGIN / REGISTER (Tampil kalau belum login) -->
    <div id="authContainer" class="auth-card" style="display: none;">
        <h2>Learnova Portal Siswa</h2>
        
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('login')">Masuk (Login)</button>
            <button class="tab-btn" onclick="switchTab('register')">Daftar Akun</button>
        </div>

        <!-- FORM LOGIN -->
        <div id="loginSection" class="form-section active">
            <form id="loginForm">
                <div class="form-group">
                    <label>Nomor Induk Siswa Nasional (NISN)</label>
                    <input type="text" id="loginNisn" required placeholder="Contoh: 0107695680">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Masukkan password kamu">
                </div>
                <button type="submit" class="btn-submit">Masuk Kelas</button>
            </form>
        </div>

        <!-- FORM REGISTER -->
        <div id="registerSection" class="form-section">
            <form id="registerForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regName" required placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label>Nomor Induk Siswa Nasional (NISN)</label>
                    <input type="text" id="regNisn" required placeholder="Buat NISN kamu">
                </div>
                <div class="form-group">
                    <label>Email Aktif</label>
                    <input type="email" id="regEmail" required placeholder="email@gmail.com">
                </div>
                <div class="form-group">
                    <label>Buat Password Baru</label>
                    <input type="password" id="regPassword" required placeholder="Buat password rahasia">
                </div>
                <button type="submit" class="btn-submit">Daftar Sekarang</button>
            </form>
        </div>

        <div id="alertBox" class="alert-msg"></div>
    </div>

    <!-- KARTU DASHBOARD SISWA (Tampil otomatis setelah berhasil login) -->
    <div id="dashboardContainer" class="dashboard-card" style="display: none;">
        <h2>Dashboard Kelas Siswa</h2>
        <div class="student-info">
            <p><strong>Nama:</strong> <span id="studentName">-</span></p>
            <p><strong>NISN:</strong> <span id="studentNisn">-</span></p>
            <p><strong>Status:</strong> <span id="studentStatus" style="color: #3fb950;">Aktif</span></p>
            <p><strong>Kehadiran:</strong> <span id="studentAttendance">-</span></p>
        </div>
        <button onclick="handleLogout()" class="btn-logout">Keluar (Logout)</button>
    </div>

    <script>
        // Cek status login saat halaman dibuka
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('studentSession');
            if (session) {
                const student = JSON.parse(session);
                // Tampilkan dashboard, sembunyikan form login
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                
                // Isi data ke dashboard
                document.getElementById('studentName').textContent = student.name;
                document.getElementById('studentNisn').textContent = student.nisn;
                document.getElementById('studentAttendance').textContent = student.attendance || 'Belum Absen';
            } else {
                // Tampilkan form login, sembunyikan dashboard
                document.getElementById('authContainer').style.display = 'block';
                document.getElementById('dashboardContainer').style.display = 'none';
            }
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('alertBox').style.display = 'none';

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerSection').classList.add('active');
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert-msg alert-${type}`;
            alertBox.style.display = 'block';
        }

        // Handle Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const nisn = document.getElementById('regNisn').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/siswa/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, nisn, email, password })
                });
                const result = await res.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (err) {
                showAlert('Gagal terhubung ke server.', 'error');
            }
        });

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nisn = document.getElementById('loginNisn').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/siswa/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nisn, password })
                });
                const result = await res.json();

                if (result.success) {
                    // Simpan sesi ke localStorage
                    localStorage.setItem('studentSession', JSON.stringify(result.student));
                    window.location.reload(); // Refresh halaman untuk memuat tampilan dashboard
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (err) {
                showAlert('Gagal terhubung ke server.', 'error');
            }
        });

        // Handle Logout
        function handleLogout() {
            localStorage.removeItem('studentSession');
            window.location.reload();
        }
    </script>
</body>
</html>
