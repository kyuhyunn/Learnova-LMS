<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Siswa - Learnova Smart Classroom</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, #1f2937 0%, var(--bg-color) 70%);
            color: var(--text-color);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .tab-menu {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            padding: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #8b949e;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .alert-msg {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            display: none;
        }
        .alert-success { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; }
        .alert-error { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #da3633; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Learnova Portal</h2>
        
        <!-- Tab Navigasi Login / Register -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Daftar Akun</button>
        </div>

        <!-- FORM LOGIN -->
        <div id="loginSection" class="form-section active">
            <form id="loginForm">
                <div class="form-group">
                    <label>Nomor Induk Siswa (NIS)</label>
                    <input type="text" id="loginNis" required placeholder="Masukkan NIS kamu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Masukkan password rahasia">
                </div>
                <button type="submit" class="btn-submit">Masuk ke Dashboard</button>
            </form>
        </div>

        <!-- FORM REGISTER (Poin 6 & 7) -->
        <div id="registerSection" class="form-section">
            <form id="registerForm">
                <div class="form-group">
                    <label>Nomor Induk Siswa (NIS)</label>
                    <input type="text" id="regNis" required placeholder="Buat NIS kamu">
                </div>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regNama" required placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label>Buat Password Baru</label>
                    <input type="password" id="regPassword" required placeholder="Minimal 6 karakter">
                </div>
                <button type="submit" class="btn-submit">Daftar Sekarang</button>
            </form>
        </div>

        <div id="alertBox" class="alert-msg"></div>
    </div>

    <script>
        // Fungsi pindah tab Form
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('alertBox').style.display = 'none';

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerSection').classList.add('active');
            }
        }

        // Helper untuk tampilkan pesan notifikasi
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert-msg alert-${type}`;
            alertBox.style.display = 'block';
        }

        // Handle Submit Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nis = document.getElementById('regNis').value;
            const nama = document.getElementById('regNama').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nis, nama, password })
                });
                const result = await res.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    setTimeout(() => switchTab('login'), 1500); // otomatis pindah ke tab login setelah 1.5 detik
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (err) {
                showAlert('Gagal terhubung ke server.', 'error');
            }
        });

        // Handle Submit Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nis = document.getElementById('loginNis').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nis, password })
                });
                const result = await res.json();

                if (result.success) {
                    showAlert('Login berhasil! Mengalihkan...', 'success');
                    setTimeout(() => {
                        window.location.href = result.redirect || 'student-dashboard.html';
                    }, 1000);
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (err) {
                showAlert('Gagal terhubung ke server.', 'error');
            }
        });
    </script>
</body>
</html>
