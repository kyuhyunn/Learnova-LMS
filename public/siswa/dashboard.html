<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnova LMS - Portal Siswa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155', accent: '#f97316' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes popupAnim {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-popup { animation: popupAnim 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-dark-bg text-slate-100 font-sans antialiased min-h-screen flex relative overflow-hidden">

    <!-- MODAL LOGIN SISWA (BERDASARKAN NISN) -->
    <div id="login-container" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-dark-card border border-dark-border w-full max-w-sm rounded-3xl p-8 space-y-6 shadow-2xl animate-popup text-center">
            <div class="inline-block bg-orange-500 p-3.5 rounded-2xl text-white shadow-lg shadow-orange-500/30 mb-1">
                <i class="fa-solid fa-user-graduate text-2xl"></i>
            </div>
            <div class="space-y-1">
                <h3 class="font-bold text-xl text-slate-100">Portal Siswa TKJ</h3>
                <p class="text-xs text-slate-400">Silakan masukkan NISN kamu untuk masuk ke kelas.</p>
            </div>
            <form onsubmit="handleStudentLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Nomor Induk Siswa Nasional (NISN)</label>
                    <input type="text" id="login-nisn" required placeholder="Contoh: 0107695680" class="w-full bg-dark-bg border border-dark-border rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-orange-500 text-center tracking-wider font-semibold">
                </div>
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-3 rounded-xl text-sm transition shadow-lg shadow-orange-500/20">
                    Masuk ke Kelas
                </button>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

    <!-- SIDEBAR SISWA -->
    <aside class="w-64 bg-dark-card border-r border-dark-border flex flex-col justify-between hidden md:flex z-10">
        <div>
            <div class="p-6 flex items-center space-x-3 border-b border-dark-border">
                <div class
